name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: python -m playwright install --with-deps chromium
      - name: Browser flows and recovery
        run: |
          mkdir -p outputs
          uvicorn backend.main:app --host 127.0.0.1 --port 8765 > /tmp/chd-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8765/health && break || sleep 1; done
          python tests/browser_flows.py
          python tests/browser_resilience.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            .impeccable/review/
            docs/*results.json
